name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        shell: python
        run: |
          import os, re, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          semver = r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?'
          assert re.fullmatch(semver, version), 'Invalid SemVer'
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Cargo.toml version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nprerelease={str("-" in version.split("+")[0]).lower()}\n')
  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/transcraft
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            binary: target/x86_64-pc-windows-msvc/release/transcraft.exe
            extension: .exe
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SUFFIX: ${{ matrix.suffix }}
      BINARY: ${{ matrix.binary }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev
      - run: cargo +nightly fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: python -m unittest discover -s tests -v
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage launcher-only artifact
        shell: python
        run: |
          import hashlib, os, pathlib, shutil
          directory = pathlib.Path('release')
          directory.mkdir()
          name = f'Transcraft-{os.environ["VERSION"]}-{os.environ["SUFFIX"]}-launcher-only{os.environ["EXTENSION"]}'
          target = directory / name
          shutil.copy2(os.environ['BINARY'], target)
          (directory / (name + '.sha256')).write_text(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {name}\n')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: release/*
  publish:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release/*
          body: |
            Launcher-only binaries for Windows 10/11 x86-64 and Linux x86-64.

            These do not include Minecraft or Java. Use the README's personal offline bundle instructions on an online build machine before transferring to an offline PC. Public releases do not redistribute Mojang game files.
