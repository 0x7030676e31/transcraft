[package]
name = "transcraft"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A personal, offline Fabric Minecraft launcher"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
flate2 = "1"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

